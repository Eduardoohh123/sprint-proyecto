<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Conexión Ionic - Spring Boot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin-top: 10px;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Test de Conexión Ionic - Spring Boot</h1>
        
        <div class="info">
            <strong>📌 Instrucciones:</strong>
            <ol>
                <li>Asegúrate de que Spring Boot esté corriendo en <code>http://localhost:8080</code></li>
                <li>Completa el formulario abajo</li>
                <li>Haz clic en "Registrar Usuario"</li>
                <li>Verifica el resultado en esta página</li>
                <li>Consulta la base de datos H2: <a href="http://localhost:8080/h2-console" target="_blank">H2 Console</a></li>
            </ol>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nombre Completo:</label>
                <input type="text" id="name" required value="Juan Pérez">
            </div>
            
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required value="juanperez">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required value="juan@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required value="password123">
            </div>
            
            <button type="submit">🚀 Registrar Usuario</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'none';
            
            const userData = {
                username: document.getElementById('username').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                console.log('📤 Enviando datos:', { ...userData, password: '***' });
                
                const response = await fetch('http://localhost:8080/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                
                console.log('📥 Respuesta recibida:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Usuario registrado:', data);
                    
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ ¡Usuario Registrado Exitosamente!</h3>
                        <p><strong>ID:</strong> ${data.id}</p>
                        <p><strong>Nombre:</strong> ${data.name}</p>
                        <p><strong>Usuario:</strong> ${data.username}</p>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p>
                            <a href="http://localhost:8080/h2-console" target="_blank">
                                🗄️ Ver en Base de Datos H2
                            </a>
                        </p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const errorText = await response.text();
                    console.error('❌ Error:', errorText);
                    
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Error al Registrar Usuario</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Mensaje:</strong> ${errorText}</p>
                    `;
                }
            } catch (error) {
                console.error('❌ Error de conexión:', error);
                
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Error de Conexión</h3>
                    <p><strong>Mensaje:</strong> ${error.message}</p>
                    <p>Asegúrate de que Spring Boot esté corriendo en <code>http://localhost:8080</code></p>
                `;
            }
            
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
