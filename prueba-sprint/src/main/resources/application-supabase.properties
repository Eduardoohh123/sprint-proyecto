spring.application.name=prueba-sprint

# Datasource (Supabase Postgres - Direct connection via IPv6)
# Usar la URL proporcionada por Supabase
spring.datasource.url=jdbc:postgresql://db.htdvrcajzddfjzpbfjhb.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Colisagay1214
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Configuración de HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}
# Bind to IPv6 unspecified address to accept IPv6 connections
server.address=::

# Supabase Admin (Service Role Key) - set as env var SUPABASE_SERVICE_ROLE_KEY or via property supabase.serviceRoleKey
# supabase.serviceRoleKey=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.host=htdvrcajzddfjzpbfjhb.supabase.co
