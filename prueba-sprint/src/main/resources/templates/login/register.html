<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Grand Line</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="main-container px-3">
        <div class="row g-4 justify-content-center align-items-center min-vh-100">
            <!-- Formulario de Registro con Glassmorphism -->
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="login-card fade-in">
                    <!-- Logo y Título -->
                    <div class="text-center pt-4 pb-3">
                        <div class="login-logo-container mb-3">
                            <img src="/images/logo.png" alt="Grand Line Logo" style="width: 50px; height: auto; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));">
                        </div>
                        <h1 class="login-title mb-2">Únete a Grand Line</h1>
                        <p class="login-subtitle">Comienza tu aventura</p>
                    </div>
                    
                    <div class="card-body p-4 px-lg-5">
                        <!-- Success/Error Messages -->
                        <div th:if="${successMessage}" class="alert alert-success mx-4" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${successMessage}"></span>
                        </div>
                        
                        <div th:if="${errorMessage}" class="alert alert-danger mx-4" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">
                            <!-- CSRF Token (Spring Security) -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            
                            <!-- Nombre Completo -->
                            <div class="mb-4">
                                <label for="name" class="form-label text-white">
                                    <i class="fas fa-user me-2"></i>Nombre Completo
                                </label>
                                <div class="input-group-modern">
                                    <span class="input-icon-modern">
                                        <i class="fas fa-signature"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control-modern" 
                                           id="name"
                                           th:field="*{name}"
                                           placeholder="Ej: Juan Pérez"
                                           required
                                           minlength="3"
                                           maxlength="100">
                                </div>
                                <small class="text-white-50 ms-1">Mínimo 3 caracteres</small>
                            </div>

                            <!-- Username -->
                            <div class="mb-4">
                                <label for="username" class="form-label text-white">
                                    <i class="fas fa-at me-2"></i>Nombre de Usuario
                                </label>
                                <div class="input-group-modern">
                                    <span class="input-icon-modern">
                                        <i class="fas fa-user-tag"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control-modern" 
                                           id="username"
                                           th:field="*{username}"
                                           placeholder="usuario123"
                                           minlength="3"
                                           maxlength="50">
                                </div>
                                <small class="text-white-50 ms-1">Opcional - Se usará tu email si no lo ingresas</small>
                            </div>
                            
                            <!-- Email -->
                            <div class="mb-4">
                                <label for="email" class="form-label text-white">
                                    <i class="fas fa-envelope me-2"></i>Correo Electrónico
                                </label>
                                <div class="input-group-modern">
                                    <span class="input-icon-modern">
                                        <i class="fas fa-at"></i>
                                    </span>
                                    <input type="email" 
                                           class="form-control-modern" 
                                           id="email"
                                           th:field="*{email}"
                                           placeholder="ejemplo@correo.com"
                                           required>
                                </div>
                            </div>
                            
                            <!-- Contraseña -->
                            <div class="mb-4">
                                <label for="password" class="form-label text-white">
                                    <i class="fas fa-lock me-2"></i>Contraseña
                                </label>
                                <div class="input-group-modern">
                                    <span class="input-icon-modern">
                                        <i class="fas fa-key"></i>
                                    </span>
                                    <input type="password" 
                                           class="form-control-modern" 
                                           id="password"
                                           th:field="*{password}"
                                           placeholder="••••••••"
                                           required
                                           minlength="6">
                                    <button type="button" class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')">
                                        <i class="fas fa-eye" id="toggleIcon1"></i>
                                    </button>
                                </div>
                                <small class="text-white-50 ms-1">Mínimo 6 caracteres</small>
                            </div>

                            <!-- Confirmar Contraseña -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label text-white">
                                    <i class="fas fa-lock me-2"></i>Confirmar Contraseña
                                </label>
                                <div class="input-group-modern">
                                    <span class="input-icon-modern">
                                        <i class="fas fa-key"></i>
                                    </span>
                                    <input type="password" 
                                           class="form-control-modern" 
                                           id="confirmPassword"
                                           placeholder="••••••••"
                                           required
                                           minlength="6">
                                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', 'toggleIcon2')">
                                        <i class="fas fa-eye" id="toggleIcon2"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Términos y condiciones -->
                            <div class="mb-4">
                                <div class="form-check-modern">
                                    <input class="form-check-input-modern" type="checkbox" id="terms" required>
                                    <label class="form-check-label-modern" for="terms">
                                        Acepto los <a href="#" class="link-modern">términos y condiciones</a>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-3 mb-4">
                                <button type="submit" class="btn-modern btn-modern-primary" id="registerBtn">
                                    <i class="fas fa-user-plus me-2"></i>
                                    <span>Crear Cuenta</span>
                                </button>
                            </div>

                            <!-- Divider -->
                            <div class="divider-modern">
                                <span>O</span>
                            </div>

                            <!-- Login Link -->
                            <div class="text-center mt-4">
                                <p class="text-white-50 mb-0">
                                    ¿Ya tienes una cuenta? 
                                    <a href="/login" class="link-modern fw-bold">
                                        Inicia sesión aquí
                                    </a>
                                </p>
                            </div>

                            <!-- Back to Home -->
                            <div class="text-center mt-3">
                                <a href="/" class="link-modern">
                                    <i class="fas fa-home me-1"></i>Volver al inicio
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle Password Visibility
        function togglePassword(fieldId, iconId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Input Focus Animation
        document.querySelectorAll('.form-control-modern').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });

        // Validación de contraseñas
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Las contraseñas no coinciden. Por favor, verifica.');
                return false;
            }

            // Deshabilitar botón y mostrar loading
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i><span>Creando cuenta...</span>';
        });

        // Validar fortaleza de contraseña
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            
            // Remover feedback anterior
            const oldFeedback = e.target.parentElement.parentElement.querySelector('.password-strength');
            if (oldFeedback) oldFeedback.remove();
            
            if (password.length >= 6) {
                let strength = 'Débil';
                let color = 'rgba(220, 53, 69, 0.8)';
                
                // Verificar fortaleza
                const hasNumbers = /\d/.test(password);
                const hasUpperCase = /[A-Z]/.test(password);
                const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
                
                const strengthCount = [hasNumbers, hasUpperCase, hasSpecialChar].filter(Boolean).length;
                
                if (password.length >= 8 && strengthCount >= 2) {
                    strength = 'Fuerte';
                    color = 'rgba(40, 199, 111, 0.8)';
                } else if (password.length >= 6 && strengthCount >= 1) {
                    strength = 'Media';
                    color = 'rgba(255, 193, 7, 0.8)';
                }
                
                const feedback = document.createElement('small');
                feedback.innerHTML = `Fortaleza: <span style="color: ${color}; font-weight: bold;">${strength}</span>`;
                feedback.className = 'text-white-50 ms-1 password-strength';
                e.target.parentElement.parentElement.appendChild(feedback);
            }
        });
    </script>
</body>
</html>
