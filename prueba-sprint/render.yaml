services:
  - type: web
    name: prueba-sprint-api
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/prueba-sprint-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: prueba-sprint-db
          property: connectionString
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx512m

databases:
  - name: prueba-sprint-db
    databaseName: prueba_sprint_db
    user: postgres
